[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ssaggr"
version = "0.1.0"
description = "Aggressiveness determinants of Sclerotinia sclerotiorum from dual RNA-seq and growth-chamber assays, tested isolate-wise"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyyaml>=6.0", "scipy>=1.10", "scikit-learn>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["ssaggr*"]
