counts:
  Gm: /Users/andrew20445/RNAseq_paper/Sclerotinia_dualRNAseq/data/counts/gene_counts_soybean_SALMON_PATHOGEN_only.txt
  Ha: /Users/andrew20445/RNAseq_paper/Sclerotinia_dualRNAseq/data/counts/gene_counts_sunflower_SALMON_PATHOGEN_only.txt
# host library totals (column sums of the *_SALMON_HOST_only.txt matrices) for pathogen transcript share
