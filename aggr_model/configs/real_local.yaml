# Final Table S1 from CH4_multicrop_aggressiveness.Rmd (long format: crop, isolate, mean, SE, n_plants, rank)
phenotype_table: /Users/andrew20445/RNAseq_paper/CH4_figures_tables/IA_progress_final/outputs_fig2/TableS1_long.csv
per_plant_saudpc: /Users/andrew20445/RNAseq_paper/CH4_figures_tables/IA_progress_final/outputs_fig2/sAUDPC_per_plant.csv
host_to_crop: {Gm: Soybean, Ha: Sunflower}
in_vitro:
  oxalic_acid_per_mg:
    file: /Users/andrew20445/RNAseq_paper/CH4_figures_tables/OA_quantification_results_20261005.csv
    isolate_col: ID
    value_col: mean_mM_per_mg
  appressoria_per_field_96h:
    file: /Users/andrew20445/RNAseq_paper/CH4_figures_tables/appressorium_per_field_72.csv
    isolate_col: isolate
    value_col: per_field
    filter: {hpi: 96}
  radial_growth_sAUGC:
    file: /Users/andrew20445/RNAseq_paper/CH4_figures_tables/STAUDGC_per_plate.csv
    isolate_col: isolate
    value_col: STAUDGC
annotation: /Users/andrew20445/RNAseq_paper/_backup_original/CH3_paper/Q6/Ss_counts_secretome_annotation.tsv
isolate_aliases: {Ss1980: "1980", SsPotter: SSPotter, SSpotter: SSPotter}
classes: {WISS47: low, JS659: low, MNSS6: high, Xtra7: high, SSPotter: soy_adapted, BN172: sun_adapted}
timepoints: ["24", "48", "96"]
timepoint_sets: [["24"], ["48"], ["96"], ["24", "48", "96"]]   # each alone, then pooled
target_scale: z          # sAUDPC standardised within host, as in the proposal
stability_scale: raw     # Eberhart-Russell on sAUDPC as measured
# YOUR HYPOTHESIS (fill in before running; leave empty to skip):
hypothesis_classes: {}   # e.g. {ISOLATE_A: consistent, ISOLATE_B: host_variable, ...}
stability_cutoffs: {}    # or e.g. {mean_rank_min_high: 9, rank_range_max_consistent: 5}
n_jobs: 4
n_permutations: 200      # 719 = every ordering of 6 isolates (exact), ~4x slower
n_bootstrap: 60
