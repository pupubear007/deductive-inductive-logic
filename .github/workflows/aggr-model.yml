name: Aggressiveness model (Python)

on:
  push:
    paths: ["aggr_model/**", ".github/workflows/aggr-model.yml"]
  pull_request:
    paths: ["aggr_model/**", ".github/workflows/aggr-model.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aggr_model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q
