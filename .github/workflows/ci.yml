name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lean:
    name: Lean formalization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (fetches the Mathlib cache)
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
      - name: Check axioms
        working-directory: lean
        run: |
          lake env lean AxiomCheck.lean | tee axioms.txt
          test -s axioms.txt
          allowed='(propext|Classical\.choice|Quot\.sound)'
          if grep -vE "(does not depend on any axioms|depends on axioms: \[${allowed}(, ${allowed})*\])$" axioms.txt; then
            echo "::error::A theorem depends on sorry or a non-standard axiom (lines above)."
            exit 1
          fi
          if grep -rn --include='*.lean' -w sorry WangLogic; then
            echo "::error::Found sorry in the formalization."
            exit 1
          fi

  paper:
    name: Paper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PDF
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: paper.tex
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/paper.pdf
