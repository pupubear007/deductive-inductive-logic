name: SSR model (Python)

on:
  push:
    paths: ["ssr_model/**", ".github/workflows/ssr-model.yml"]
  pull_request:
    paths: ["ssr_model/**", ".github/workflows/ssr-model.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ssr_model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
