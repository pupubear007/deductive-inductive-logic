fidelity:
  divergences: >-
    Section 5.3 assumes a finite set of worlds and a prior with full support. Section 7 uses two
    models. Proposition 7.1 uses Mathlib's orthogonal projections
    (Submodule.starProjection) on a finite-dimensional complex inner product space, with P ≤ Q
    read as subspace inclusion, and Proposition 7.4 uses the lattice of subspaces of ℂ².
    Propositions 7.2, 7.3, 7.5 and 7.6 use complex matrices: a projector is a
    Hermitian idempotent matrix, a density operator is positive semidefinite with trace 1, the
    Born probability is Re Tr(ρP), and in 7.3 the order P ≤ Q is written Q * P = P. In 7.5(2),
    "|↑⟩ is the maximum-likelihood state" is proved as: its likelihood is at least that of every
    density operator.

review:
  status: unchecked
