# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# Project metadata in the formalization.yaml format (https://github.com/mathlib-initiative/formalization.yaml).
version: "v0.4"

project:
  name: "Deductive and inductive logic, formalized"
  description: "Lean formalization of every theorem of the paper: the possible-worlds semantics of deduction and induction (Sections 3–6, core Lean), and with Mathlib the Bayesian confirmation, defeasible inference and ordered-level extensions (Sections 5.3, 5.4, 6.1) and the quantum information model (Section 7)."
  authors: ["Hsuan Fu Wang"]
  license: "Apache-2.0"

sources:
  - title: "Deduction and Induction in One Diagram: A Machine-Checked Semantics with Applications to Quantum Information and Plant Disease Diagnosis"
    authors: ["Hsuan Fu Wang"]
    id: ../paper.pdf
    # Submitted version; the February 2025 manuscripts are in ../archive/.
    type: article

classification:
  arxiv: ["math.LO", "cs.LO", "quant-ph"]
  msc2020: ["03A05", "03B48", "68T27", "68V20", "81P10"]

automation:
  methods:
    - method: agent
      framework: "Claude Code"
      tool_setup: "Lean 4 toolchain v4.34.1 with Mathlib; lake build and #print axioms checks"
      prompting_notes: "The author set the tasks section by section (formalize a stated result, report any statement changes); the agent wrote the Lean proofs and the corresponding LaTeX."

status:
  scope: "Complete: every theorem, proposition and corollary of the paper is formalized."
  main_results:
    - comparator_config: ComparatorChallenges/InductionNotDeduction.json
      declaration: WangLogic.induction_not_deduction
      file: WangLogic/Basic.lean
    - declaration: WangLogic.quantum_deduction_sound
      file: WangLogic/Quantum.lean
      axioms: [propext, Classical.choice, Quot.sound]
      sorry_count: 0
    - declaration: WangLogic.classical_trace_pos_iff
      file: WangLogic/Quantum.lean
      axioms: [propext, Classical.choice, Quot.sound]
      sorry_count: 0
    - declaration: WangLogic.likelihood_spinState_phase
      file: WangLogic/Quantum.lean
      axioms: [propext, Classical.choice, Quot.sound]
      sorry_count: 0
    - declaration: WangLogic.confirms_of_entails
      file: WangLogic/Confirmation.lean
      axioms: [propext, Classical.choice, Quot.sound]
      sorry_count: 0
    - declaration: WangLogic.allWhite_confirmed
      file: WangLogic/Confirmation.lean
      axioms: [propext, Classical.choice, Quot.sound]
      sorry_count: 0
    - declaration: WangLogic.Normally.cautious_mono
      file: WangLogic/Defeasible.lean
      axioms: [propext, Classical.choice, Quot.sound]
      sorry_count: 0
    - declaration: WangLogic.Hierarchy.Established.mono
      file: WangLogic/Levels.lean
      axioms: [propext, Classical.choice, Quot.sound]
      sorry_count: 0
    - declaration: WangLogic.quantum_not_distributive
      file: WangLogic/QuantumExtensions.lean
      axioms: [propext, Classical.choice, Quot.sound]
      sorry_count: 0
    - declaration: WangLogic.vonNeumannEntropy_unitary_conj
      file: WangLogic/QuantumExtensions.lean
      axioms: [propext, Classical.choice, Quot.sound]
      sorry_count: 0

fidelity:
  divergences: >-
    Section 5.3 assumes a finite set of worlds and a prior with full support. Section 7 uses two
    models. Proposition 7.1 uses Mathlib's orthogonal projections
    (Submodule.starProjection) on a finite-dimensional complex inner product space, with P ≤ Q
    read as subspace inclusion, and Proposition 7.4 uses the lattice of subspaces of ℂ².
    Propositions 7.2, 7.3, 7.5 and 7.6 use complex matrices: a projector is a
    Hermitian idempotent matrix, a density operator is positive semidefinite with trace 1, the
    Born probability is Re Tr(ρP), and in 7.3 the order P ≤ Q is written Q * P = P. In 7.5(2),
    "|↑⟩ is the maximum-likelihood state" is proved as: its likelihood is at least that of every
    density operator.

review:
  status: unchecked
